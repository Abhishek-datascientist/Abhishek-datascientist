name: Build

on:
  pull_request:
    branches:
      - pocket-tracker-dev
      - pocket-tracker-sit
      - pocket-tracker
  push:
    branches:
      - pocket-tracker-dev
      - pocket-tracker-sit
      - pocket-tracker

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
